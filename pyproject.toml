[project]
name = "ecoshield"
version = "0.1.0"
description = "EcoShield: Climate Risk Intelligence Platform"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "agno>=1.0.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "xarray>=2025.6.1",
    "rasterio>=1.4.4",
    "scipy>=1.15.3",
    "shapely>=2.1.2",
    "geopandas>=1.1.2",
    "duckdb>=1.4.4",
    "boto3>=1.42.47",
    "cdsapi>=0.7.7",
    "earthengine-api>=1.7.13",
    "netcdf4>=1.7.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "black>=24.0.0",
    "mypy>=1.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "numpy>=2.2.6",
    "pytest-asyncio>=1.3.0",
]
